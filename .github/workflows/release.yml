name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Sanity check before tagging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...

  version:
    name: Compute and push version tag
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute next vYYYY.MM.N tag
        id: version
        run: |
          prefix="v$(date -u +%Y.%m)"
          last=$(git tag -l "${prefix}.*" | sed "s/^${prefix}\.//" | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          tag="${prefix}.${next}"
          echo "Releasing $tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  build:
    name: Build (${{ matrix.artifact }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: coderead-linux-amd64
            output: coderead-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: coderead-linux-arm64
            output: coderead-linux-arm64
          - goos: darwin
            goarch: arm64
            artifact: coderead-macos-arm64
            output: coderead-macos-arm64
          - goos: darwin
            goarch: amd64
            artifact: coderead-macos-amd64
            output: coderead-macos-amd64
          - goos: windows
            goarch: amd64
            artifact: coderead-windows-amd64
            output: coderead-windows-amd64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ needs.version.outputs.tag }}" -o dist/${{ matrix.artifact }}/${{ matrix.output }} .
      - name: Checksum
        run: cd dist/${{ matrix.artifact }} && shasum -a 256 ${{ matrix.output }} | tee ${{ matrix.output }}.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" release/* \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
